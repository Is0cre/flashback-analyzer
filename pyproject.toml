[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashback-analyzer"
version = "0.1.0"
description = "Read-only Flashback thread collector and opinion-analysis foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Flashback Analyzer contributors"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fb = "flashback_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flashback_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
